[project]
name = "learnanylanguage"
version = "0.2.0"
description = "Short ChatGPT Voice speaking lessons in any language, from pluggable tracks installed from GitHub releases"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
lal = "lal.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
